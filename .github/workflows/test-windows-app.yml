name: Windows test app (Tier 2 e2e)
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-test-app:
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          sdk: '10.0.22621.0'

      - name: Install Ninja
        run: choco install ninja -y --no-progress

      # Build the prebuilt llama.cpp core that RNLlama.vcxproj links. This
      # produces windows/rnllama-x64/lib/rnllama.lib in the llama.rn checkout.
      - name: Build llama.rn Windows core
        run: powershell -ExecutionPolicy Bypass -File scripts\build-windows.ps1 -Arch x64
        working-directory: ${{ github.workspace }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20.x

      # Install the RNW app deps. react-native-windows-init needs node_modules.
      - name: Install test app dependencies
        run: npm install --no-audit --no-fund
        working-directory: ${{ github.workspace }}/test-windows-app

      # npm may symlink `file:..` (node_modules/llama.rn -> repo root) or copy it.
      # The autolinked RNLlama.vcxproj links rnllama.lib relative to the copy it
      # is built from. When llama.rn is a symlink/junction to the repo root, the
      # vcxproj resolves to the repo's own windows/RNLlama.vcxproj and already
      # sees the prebuilt core at windows/rnllama-x64/ — nothing to copy. Only a
      # truly copied install needs the core synced. Detect the link type instead
      # of comparing resolved paths (which is unreliable on Windows).
      - name: Ensure prebuilt core reachable from node_modules/llama.rn
        shell: pwsh
        run: |
          $src = (Resolve-Path "windows\rnllama-x64" -ErrorAction Stop).Path
          $pkgItem = Get-Item "test-windows-app\node_modules\llama.rn" -ErrorAction Stop
          $isLink = ($pkgItem.LinkType -eq 'SymbolicLink' -or $pkgItem.LinkType -eq 'Junction')

          if ($isLink) {
            Write-Host "node_modules/llama.rn is a $($pkgItem.LinkType) -> $($pkgItem.Target); prebuilt core already reachable via repo"
            $dstPath = $src
          } else {
            Write-Host "node_modules/llama.rn is a copied install; copying prebuilt core"
            $dstPath = Join-Path $pkgItem.FullName "windows\rnllama-x64"
            New-Item -ItemType Directory -Force -Path $dstPath | Out-Null
            Copy-Item -Recurse -Force (Join-Path $src "*") $dstPath
          }
          # Final assert: the Release + Debug core must be present at dstPath.
          Write-Host "dst=$dstPath"
          Write-Host "Release core present: $(Test-Path (Join-Path $dstPath 'lib\Release\rnllama.lib'))"
          Write-Host "Debug core present:   $(Test-Path (Join-Path $dstPath 'lib\Debug\rnllama.lib'))"

      # Generate the RNW windows/ project for the app + autolink llama.rn.
      # react-native-windows is pinned in test-windows-app/package.json so the
      # init command targets the same version as the authored module (0.82).
      # Note: for RNW > 0.75 the command is `react-native init-windows` (the
      # old `react-native-windows-init` CLI only supports RNW <= 0.75).
      - name: Initialize Windows project
        run: |
          npx react-native init-windows --overwrite
          git checkout metro.config.js index.js App.tsx
        working-directory: ${{ github.workspace }}/test-windows-app

      # Autolink llama.rn into the generated windows/ project explicitly. The
      # app depends on llama.rn via a `file:..` spec so RNW reads llama.rn's own
      # repo-root react-native.config.js (dependency.platforms.windows) and
      # links windows/RNLlama.vcxproj.
      - name: Autolink Windows
        run: |
          npx react-native autolink-windows
        working-directory: ${{ github.workspace }}/test-windows-app

      # Build the Release x64 solution. Autolinking should pull in llama.rn's
      # windows/RNLlama.vcxproj (compiling windows/RNLlama.cpp + cpp/jsi/** and
      # linking rnllama.lib from the artifact above). This is what proves the
      # module compiles for real and links into a full RNW app.
      - name: Build app (Release x64)
        run: |
          npx react-native run-windows --release --no-launch --arch x64 --logging --no-deploy --no-packager
        working-directory: ${{ github.workspace }}/test-windows-app
        timeout-minutes: 60

      # Runtime smoke test: deploy + launch the app for real and assert that
      # installJsi() / installJSIBindings actually run on the live Windows
      # runtime. RNLlama writes a marker into the app's LocalFolder when install
      # succeeds; we poll for it. Debug needs Metro running to serve the JS
      # bundle (installJsi runs at module load in index.js).
      - name: Runtime smoke test (deploy + launch + verify JSI install)
        run: |
          # Clear any stale marker from prior runs.
          Get-ChildItem "$env:LOCALAPPDATA\Packages" -Recurse -Filter rnllama-install-ok.txt -ErrorAction SilentlyContinue | Remove-Item -Force

          # Start Metro (packager) in the background; the app needs it to load JS.
          $metCwd = "${{ github.workspace }}\test-windows-app"
          # Use cmd /c npx (resolves npx from PATHS set by setup-node) rather
          # than node_modules\.bin\npx.cmd, which may not exist depending on how
          # npm linked the packages.
          Start-Process -FilePath "cmd.exe" -ArgumentList "/c npx react-native start" -WorkingDirectory $metCwd -RedirectStandardOutput "${{ github.workspace }}\metro.log" -RedirectStandardError "${{ github.workspace }}\metro.err" -WindowStyle Hidden

          # Wait for Metro to be ready (poll the packager status endpoint).
          $ready = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 2
            try {
              $r = Invoke-WebRequest -Uri "http://localhost:8081/status" -UseBasicParsing -TimeoutSec 2
              if ($r.StatusCode -eq 200) { $ready = $true; break }
            } catch {}
          }
          if (-not $ready) { Write-Error "Metro did not become ready (see metro.err)"; Get-Content "${{ github.workspace }}\metro.err" -ErrorAction SilentlyContinue; exit 1 }

          # Deploy the app WITHOUT launching (builds Debug + installs the AppX).
          npx react-native run-windows --arch x64 --logging --no-packager --no-launch

          # Packaged UWP apps are blocked from localhost by default (loopback
          # isolation), so exempt this app's package or it cannot reach Metro
          # at localhost:8081 to load the JS bundle (and installJsi never runs).
          $pkg = Get-AppxPackage | Where-Object { $_.Name -like 'RNLlamaWindowsTestApp*' } | Select-Object -First 1
          if (-not $pkg) { Write-Error "Installed app package not found"; Get-AppxPackage | Select-Object -First 10 | Out-String | Write-Host; exit 1 }
          Write-Host "Exempting loopback for package: $($pkg.PackageFamilyName)"
          & CheckNetIsolation.exe LoopbackExempt -a -n="$($pkg.PackageFamilyName)"
          if ($LASTEXITCODE -ne 0) { Write-Error "CheckNetIsolation LoopbackExempt failed ($LASTEXITCODE)"; exit 1 }

          # Launch the app via its package (needs the freshly-created loopback exemption).
          $manifest = Get-AppxPackageManifest $pkg
          $appId = $manifest.Package.Applications.Application.Id
          Write-Host "Launching app $($pkg.PackageFamilyName)!$appId"
          explorer.exe "shell:AppsFolder\$($pkg.PackageFamilyName)!$appId" 2>&1 | Out-Host
          Write-Host "App launch issued."
        working-directory: ${{ github.workspace }}/test-windows-app
        timeout-minutes: 30

      - name: Verify JSI install marker (poll)
        shell: pwsh
        run: |
          # The app takes time after launch to load the JS bundle from Metro and
          # run installJsi(), so poll for the marker up to 3 minutes.
          $marker = $null
          for ($i = 0; $i -lt 90; $i++) {
            Start-Sleep -Seconds 2
            $marker = Get-ChildItem "$env:LOCALAPPDATA\Packages" -Recurse -Filter rnllama-install-ok.txt -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($marker) { break }
          }
          if (-not $marker) {
            Write-Error "JSI install marker not found — llama.rn did not install its JSI bindings at runtime on Windows (checked for 3 min)."
            exit 1
          }
          Write-Host "JSI install marker found: $($marker.FullName)"
          Get-Content $marker.FullName
          Write-Host "SUCCESS: llama.rn JSI bindings installed and ran on Windows."