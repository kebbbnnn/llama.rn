name: Windows test app (Tier 2 e2e)
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-test-app:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja
        run: choco install ninja -y --no-progress

      # Build the prebuilt llama.cpp core that RNLlama.vcxproj links. This
      # produces windows/rnllama-x64/lib/rnllama.lib in the llama.rn checkout.
      - name: Build llama.rn Windows core
        run: powershell -ExecutionPolicy Bypass -File scripts\build-windows.ps1 -Arch x64
        working-directory: ${{ github.workspace }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20.x

      # Install the RNW app deps. react-native-windows-init needs node_modules.
      - name: Install test app dependencies
        run: npm install --no-audit --no-fund
        working-directory: ${{ github.workspace }}/test-windows-app

      # Generate the RNW windows/ project for the app + autolink llama.rn.
      # react-native-windows is pinned in test-windows-app/package.json so the
      # init command targets the same version as the authored module (0.82).
      # Note: for RNW > 0.75 the command is `react-native init-windows` (the
      # old `react-native-windows-init` CLI only supports RNW <= 0.75).
      - name: Initialize Windows project
        run: |
          npx react-native init-windows --overwrite
        working-directory: ${{ github.workspace }}/test-windows-app

      # Surface RNW's autolinking config resolution explicitly so a config
      # error isn't buried inside run-windows. llama.rn must appear with its
      # windows platform (from the repo-root react-native.config.js).
      - name: Debug llama.rn autolink config
        run: |
          npx react-native config 2>&1 | grep -A8 '"llama.rn"' || echo "(llama.rn not resolved in config)"

      # Autolink llama.rn into the generated windows/ project explicitly. This
      # is the step that crashed before ("forEach on undefined"); separating it
      # isolates the failure.
      - name: Autolink Windows
        run: |
          npx react-native autolink-windows
        working-directory: ${{ github.workspace }}/test-windows-app

      # Build the Debug x64 solution. Autolinking should pull in llama.rn's
      # windows/RNLlama.vcxproj (compiling windows/RNLlama.cpp + cpp/jsi/** and
      # linking rnllama.lib from the artifact above). This is what proves the
      # module compiles for real and links into a full RNW app.
      - name: Build app (Debug x64)
        run: |
          npx react-native run-windows --no-launch --arch x64 --logging --no-deploy --no-packager
        working-directory: ${{ github.workspace }}/test-windows-app
        timeout-minutes: 60